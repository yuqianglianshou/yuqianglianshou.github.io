<!DOCTYPE html>
<html lang="zh-CN">

  {% include head.html %}

  <body class="layout-{{ page.layout | default: 'default' }}">

    <div class="mobile btn-mobile-menu">
      <div class="nav_container">
         <nav class="nav-menu-item">
            <span class="nav-menu-item">
              <a href="/#blog" title="{% if site.blog_button.description %}{{ site.blog_button.description }}{% else %}{{ site.blog_button.title }}{% endif %}" class="blog-button">
                {{ site.blog_button.title }}
              </a>
            </span>
            {% for item in site.nav %}
                <span class="nav-menu-item">
                  <a href="{{ item.url }}" title="{{ item.description }}" class="btn-mobile-menu__icon"{% if item.new_window %} target="_blank" rel="noopener noreferrer"{% endif %}>
                      {{ item.title }}
                  </a>
                </span>
            {% endfor %}
          </nav>
      </div>
    </div>
    
    {% include side-panel.html %}

    <div class="content-wrapper">
        <div class="content-wrapper__inner">
            {{ content }}
            {% include footer.html %}
        </div>
    </div>
    
    {% include external.html %}
    
  </body>

</html>
