---
layout: default
---

<div class="post-page">
  <article class="post-container post-container--single" itemscope itemtype="https://schema.org/BlogPosting">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">
        <img src="/images/calendar.svg" width="20" height="20" alt="" aria-hidden="true">
        <time datetime="{{ page.date | date: date_to_xmlschema }}" itemprop="datePublished" class="post-meta__date date">{{ page.date | date: "%F" }}</time>
        {% if page.tags.size > 0 %}
        <img src="/images/tag-icon.svg" width="20" height="20" alt="" aria-hidden="true">
        <span class="post-meta__tags tag-links">{% for tag in page.tags %}<a href="/tags#{{ tag }}-ref" itemprop="keywords">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}</span>
        {% endif %}
      </div>
    </header>

    <section class="post">
      {{ content }}
    </section>
  </article>

  {% include new-old.html %}
</div>
