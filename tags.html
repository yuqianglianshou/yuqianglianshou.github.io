---
layout: page
title:
header: 根据快速导航到相应的文章
group: navigation
---
<ul class="tag_box inline">
  {% for tag in site.tags %}
    <li>
      <a href="#{{ tag[0] }}-ref">{{ tag[0] }} <span>{{ tag[1].size }}</span></a>
    </li>
  {% endfor %}
</ul>

<div class="card">
  {% for tag in site.tags %}
  <h3 id="{{ tag[0] }}-ref">{{ tag[0] }}</h3>
  <ul>
    {% for post in tag[1] %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
  {% endfor %}
</div>
